name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一 PR/ref に新しい push が来たら進行中の古い CI 実行をキャンセルする
# （重複実行を避けて CI 分の節約とフィードバック高速化）。merge 後の main は
# この workflow を起動しない（pull_request / workflow_dispatch のみ）ので
# デプロイには影響しない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check edge code (Workers + Pages Functions)
        run: npm run typecheck:edge

      - name: Test
        run: npm run test

      - name: Build static export
        run: npm run build
